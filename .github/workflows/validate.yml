name: Validate Tools JSON

on:
  pull_request:
    paths:
      - 'tools.json'
      - 'scripts/validate.js'
  push:
    branches:
      - main
    paths:
      - 'tools.json'
      - 'scripts/validate.js'

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation script
        run: node scripts/validate.js

      - name: Collect statistics
        id: stats
        run: |
          TOOL_COUNT=$(node -e "const tools=require('./tools.json'); console.log(tools.length)")
          CATEGORY_COUNT=$(node -e "const tools=require('./tools.json'); console.log(new Set(tools.map(tool => tool.category)).size)")
          echo "count=$TOOL_COUNT" >> "$GITHUB_OUTPUT"
          echo "categories=$CATEGORY_COUNT" >> "$GITHUB_OUTPUT"

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## Validation passed',
              '',
              `- Total tools: ${{ steps.stats.outputs.count }}`,
              `- Categories: ${{ steps.stats.outputs.categories }}`,
              '- Checks: JSON syntax, duplicates, required fields, URL format, category validation'
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
