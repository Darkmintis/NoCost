name: Validate Tools JSON

on:
  pull_request:
    paths:
      - 'tools.json'
      - 'scripts/validate.js'
  push:
    branches:
      - main
    paths:
      - 'tools.json'
      - 'scripts/validate.js'

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    # Keep this job permission-free on purpose: fork PRs get a read-only
    # GITHUB_TOKEN, so ANY step needing write permissions fails the check
    # for outside contributors. Validation only needs to read files.
    # Comments on fork PRs live in comment.yml (pull_request_target).
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run validation script
        run: node scripts/validate.js

      - name: Collect statistics
        id: stats
        run: |
          TOOL_COUNT=$(node -e "const tools=require('./tools.json'); console.log(tools.length)")
          CATEGORY_COUNT=$(node -e "const tools=require('./tools.json'); console.log(new Set(tools.map(tool=>tool.category)).size)")
          echo "count=$TOOL_COUNT" >> "$GITHUB_ENV"
          echo "categories=$CATEGORY_COUNT" >> "$GITHUB_ENV"
          {
            echo "## Validation passed"
            echo ""
            echo "- Total tools: $TOOL_COUNT"
            echo "- Categories: $CATEGORY_COUNT"
            echo "- Checks: JSON syntax, duplicates, required fields, URL format, category validation"
            echo "- Contributor PR stats also posted as a comment by the \`Comment Validation Result\` workflow"
          } >> "$GITHUB_STEP_SUMMARY"
