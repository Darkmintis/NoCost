name: Notify Site

on:
  push:
    branches:
      - main
    paths:
      - 'tools.json'

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger NoCost.dev sync workflow
        env:
          SITE_REPO_TOKEN: ${{ secrets.NOCOST_SITE_REPO_TOKEN }}
        run: |
          if [ -z "$SITE_REPO_TOKEN" ]; then
            echo "Missing secret NOCOST_SITE_REPO_TOKEN"
            exit 1
          fi

          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $SITE_REPO_TOKEN" \
            https://api.github.com/repos/Darkmintis/NoCost.dev/dispatches \
            -d '{"event_type":"tools-updated","client_payload":{"source_repo":"Darkmintis/NoCost","source_sha":"${{ github.sha }}"}}'

      - name: Log dispatch summary
        run: |
          echo "Dispatched tools-updated event to Darkmintis/NoCost.dev"
          echo "Source commit: ${{ github.sha }}"
