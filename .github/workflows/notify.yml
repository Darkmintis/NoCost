name: Notify Site

on:
  push:
    branches:
      - main
    paths:
      - 'tools.json'

jobs:
  dispatch:
    runs-on: ubuntu-latest

    steps:
      - name: Check dispatch secret
        id: secret_check
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing secret DISPATCH_TOKEN. The site repo will not be notified until this secret is configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger NoCost.dev sync workflow
        if: steps.secret_check.outputs.available == 'true'
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            https://api.github.com/repos/Darkmintis/NoCost.dev/dispatches \
            -d '{"event_type":"tools-updated","client_payload":{"source_repo":"Darkmintis/NoCost","source_sha":"${{ github.sha }}"}}'

      - name: Log dispatch summary
        run: |
          if [ "${{ steps.secret_check.outputs.available }}" = "true" ]; then
            echo "Dispatched tools-updated event to Darkmintis/NoCost.dev"
          else
            echo "Skipped dispatch because DISPATCH_TOKEN is not configured"
          fi
          echo "Source commit: ${{ github.sha }}"
